<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTube — My Account</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="topbar">
        <div class="container topbar__inner">
            <a class="brand" href="index.html">WeTube</a>
            <nav class="nav">
                <a href="index.html" class="nav__link">Home</a>
                <a href="#" id="logoutBtn" class="nav__link">Log out</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 class="hero__title">My Account</h1>
            <p class="hero__subtitle">Your Profile Info</p>
        </section>
        <section class="account-layout">

            <!-- LEFT: Profile -->
            <div class="account-panel">
                <h2 class="panel-title">Profile</h2>

                <h3 id="fullName" class="profile__name">Name Surname</h3>
                <p id="username" class="muted">@username</p>
                <p id="email" class="muted">email@example.com</p>
                
                <!-- Delete Account (inside profile box) -->
                <div style="margin-top:24px;">
                    <button id="deleteAccountBtn" class="btn btn-danger" type="button">
                        Delete Account
                    </button>

                    <div id="deleteAccountBox" class="danger-box hidden">
                        <p class="muted" style="margin:10px 0;">
                            Enter your password to confirm account deletion.
                        </p>

                        <input
                            id="deleteAccountPassword"
                            type="password"
                            class="input"
                            placeholder="Your password"
                            autocomplete="current-password"
                        />

                        <p id="deleteAccountMsg" class="muted" style="margin-top:8px;"></p>

                        <div style="margin-top:10px; display:flex; gap:10px;">
                            <button id="confirmDeleteAccountBtn" class="btn btn-danger" type="button">
                                Permanently Delete Account
                            </button>
                            <button id="cancelDeleteAccountBtn" class="btn btn-ghost" type="button">
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- RIGHT: Actions -->
            <div class="account-panel">
                <h2 class="panel-title">Actions</h2>

                <a href="editprofile.html" class="btn account-btn">Edit Profile</a>
                <a href="accountdashboard.html" class="btn account-btn">My Videos</a>
                <a href="history.html" class="btn account-btn">Watch History</a>

                <!-- Admin only -->
                <div id="adminSection" class="admin-section hidden">
                <h3 class="admin-title">Admin</h3>
                <a href="admin.html" class="btn btn-ghost account-btn">
                    Admin Dashboard
                </a>
                </div>
            </div>

            </section>

       
    </main>

    <footer class="footer">
        <div class="container muted">© WeTube</div>
    </footer>

<script src="js/app.js?v=3"></script>
</body>
</html>
