<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeTube — Edit Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">WeTube</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="myaccount.html" class="nav__link">My Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero__title">Edit Profile</h1>
      <p class="hero__subtitle">Update your personal information.</p>
    </section>

    <section class="account-grid">

      <div class="account-card">
        <h2 class="account-card__title">Profile Information</h2>

        <form id="editProfileForm" class="admin-form" novalidate>
          <label class="label" for="firstName">Name</label>
          <input id="firstName" name="first_name" class="input" type="text" placeholder="Name" autocomplete="given-name" />

          <label class="label" for="lastName">Surname</label>
          <input id="lastName" name="last_name" class="input" type="text" placeholder="Surname" autocomplete="family-name" />

          <label class="label" for="username">Username</label>
          <input id="username" name="username" class="input" type="text" placeholder="username" autocomplete="username" />

          <label class="label" for="email">Email</label>
          <input id="email" name="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" />

          <p id="editProfileMsg" class="muted" style="margin-top:10px;"></p>

          <div class="admin-actions">
            <button class="btn" type="submit">Save Changes</button>
            <a href="myaccount.html" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container muted">© WeTube</div>
  </footer>
<script src="js/app.js?v=3"></script>
</body>
</html>
