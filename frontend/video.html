<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeTube — Watch</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">WeTube</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="myaccount.html" class="nav__link">My Account</a>
        <a href="login.html" class="nav__link">Login</a>
        <a href="register.html" class="nav__link">Register</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb">
      <a class="nav__link" href="index.html">← Back to Home</a>
    </div>

    <section class="player-wrap">
      <h1 id="videoTitle" class="video-title">Loading…</h1>
      <p id="videoDesc" class="video-desc"></p>
      <h2 id="videoUploader" class="video-uploader muted"></h2>

      <div class="video-box">
        <video id="videoPlayer" class="video-el" controls autoplay>
          <source id="videoSource" src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      
      <p id="demoNotice" class="notice hidden"></p>
    </section>

    <section class="comments-section">
      <div class="comments-box">
        <h2 class="comments-title">Comments</h2>

        <div class="comment-form">
          <textarea
            id="commentText"
            class="input textarea"
            placeholder="Add a comment..."
            rows="3"
          ></textarea>

          <button id="postCommentBtn" class="btn" type="button">
            Post comment
          </button>

          <p id="commentHint" class="muted" style="margin-top:6px; font-size:13px;"></p>
        </div>

        <div id="commentsList" class="comments-list"></div>

      </div>
    </section>
    
  </main>

  <footer class="footer">
    <div class="container muted">© WeTube</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
