<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTube - Admin</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">WeTube</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="myaccount.html" class="nav__link">My Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
        <h1 class="hero__title">Admin Dashboard</h1>
        <p class="hero__subtitle">This page removes users and videos from the database.</p>
    </section>

    <section class="admin-grid">
        <div class="admin-card">
            <h2 class="admin-card__title">Users</h2>

            <table class="table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Surname</th>
                            <th class="table-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTbody">
                        
                    </tbody>
                </table>
            

            <p id="adminMsg" class="notice hidden"></p>
        </div>

        <div class="admin-card">
            <h2 class="admin-card__title">Videos</h2>

            <div class="table_wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Uploader</th>
                            <th>Category</th>
                            <th class="table-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="videosTbody">
                        
                    </tbody>
                </table>
            </div>

            <p id="adminEmpty" class="muted hidden">No videos yet.</p>
        </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container muted">© WeTube</div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
        initAdminPage();
    });
  </script>

</body>
</html>
