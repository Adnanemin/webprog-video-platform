<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTube - Login</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="topbar">
        <div class="container topbar__inner">
            <a class="brand" href="welcome.html">WeTube</a>
            <nav class="nav">
                <a href="login.html" class="nav__link">Login</a>
                <a href="register.html" class="nav__link">Register</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="auth-wrap">
            <div class="auth-card">
                <h1 class="auth-title">Login</h1>
                <p class="auth-subtitle">
                    Demo mode for now, connect to PHP and SQL later.
                </p>

                <form id="loginForm" class="auth-form" novalidate>
                    <label class="label" for="username">Username or Email Adress</label>
                    <input
                      id="username"
                      name="login"
                      class="input"
                      type="text"
                      placeholder="example_123"
                      required
                    />

                    <label class="label" for="password">Password</label> 
                    <input
                      id="password"
                      name="password"
                      class="input"
                      type="password"
                      placeholder="********"
                      required
                    /> 

                    <button class="btn auth-btn" type="submit">Log In</button>
                </form>  
                
                <p id="loginMsg" class="notice hidden"></p>

                <p class="auth-footer muted">
                    Don't have an account?
                    <a class="link" href="register.html">Create one</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container muted">© WeTube</div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
