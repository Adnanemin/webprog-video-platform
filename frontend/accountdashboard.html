<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTube - Account Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">WeTube</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="myaccount.html" class="nav__link">My Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
        <h1 class="hero__title">Account Dashboard</h1>
        <p class="hero__subtitle">This page manages videos from the database.</p>
    </section>

    <section class="accountdashboard-grid">
        <div class="accountdashboard-card">
            <h2 class="accountdashboard-card__title">Add Videos</h2>

            <form id="addVideoForm" class="accountdashboard-form" novalidate>

                <input id="videoId" type="hidden" />

                <label class="label" for="title">Title</label>
                <input id="addTitle" class="input" type="text" placeholder="Video Title"/>

                <label class="label" for="description">Description</label>
                <textarea id="addDescription" class="input textarea" placeholder="Short description"></textarea>

                <label class="label" for="addCategoryId">Category</label>
                <select id="addCategoryId" class="input">
                    <option value="0">Uncategorized</option>
                </select>

                <label class="label" for="addVideoFile">Video File (MP4)</label>
                <input id="addVideoFile" class="input" type="file" accept="video/mp4"/>

                <label class="label" for="addThumbnail">Thumbnail (optional)</label>
                <input id="addThumbnail" class="input" type="file" accept="image/jpeg,image/png,image/webp">

                <div class="thumb-preview">
                    <img id="addThumbPreviewImg" alt="Thumbnail preview" class="thumb-preview__img hidden">
                    <p id="addThumbPreviewEmpty" class="muted">Preview will appear here.</p>
                </div>

                <div class="accountdashboard-actions">
                    <button class="btn" type="submit">Save</button>
                    <button id="cancelEditBtn" class="btn btn-ghost" type="button">Cancel</button>
                </div>
            </form>

            <p id="accountdashboardMsg" class="notice hidden"></p>
        </div>

        <div class="accountdashboard-card">
            <h2 class="accountdashboard-card__title">My Videos</h2>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th class="table-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="myVideosTbody">
                    </tbody>
                </table>
            </div>

            <p id="accountdashboardEmpty" class="muted hidden">No videos yet.</p>
        </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container muted">© WeTube</div>
  </footer>

  <script src="js/app.js"></script>

</body>
</html>
